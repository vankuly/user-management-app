version: "3.9"

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB:       usermgmt
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usermgmt"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL:      jdbc:postgresql://db:5432/usermgmt
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      VAADIN_PRODUCTION_MODE: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
